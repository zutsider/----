<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="292笔记 - 简洁、专注的本地笔记应用" />
  <title>292笔记</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="笔记列表">
      <header class="brand-row">
        <a class="brand" href="#" aria-label="292笔记首页">
          <span class="brand-mark" aria-hidden="true">292</span>
          <span>292笔记</span>
        </a>
        <button class="icon-button mobile-close" id="closeSidebar" type="button" aria-label="关闭笔记列表">×</button>
      </header>

      <button class="new-note-button" id="newNoteButton" type="button">
        <span aria-hidden="true">＋</span>
        新建笔记
        <kbd>N</kbd>
      </button>

      <div class="search-wrap">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65A8 8 0 1 1 3 11a8 8 0 0 1 16 0Z"/></svg>
        <input id="searchInput" type="search" placeholder="搜索笔记..." autocomplete="off" aria-label="搜索笔记" />
        <kbd>⌘K</kbd>
      </div>

      <nav class="filters" aria-label="笔记筛选">
        <button class="filter-button active" data-filter="all" type="button">
          <span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>全部笔记</span>
          <span class="filter-count" id="allCount">0</span>
        </button>
        <button class="filter-button" data-filter="pinned" type="button">
          <span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 17-5 5v-8l-3-3 7-7 3 3 6-1-7 7 3 3Z"/></svg>已置顶</span>
          <span class="filter-count" id="pinnedCount">0</span>
        </button>
      </nav>

      <div class="list-heading">
        <span id="listTitle">最近笔记</span>
        <button class="sort-button" id="sortButton" type="button" title="切换排序" aria-label="当前按最新修改排序">最新修改 ↓</button>
      </div>

      <div class="notes-list" id="notesList" role="list"></div>

      <footer class="sidebar-footer">
        <span><i class="status-dot"></i><span id="storageStatus">已保存到本地</span></span>
        <div class="theme-switch" role="group" aria-label="主题切换">
          <button class="theme-option" data-theme-option="light" type="button" aria-pressed="true" title="浅色模式">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.64 5.64l1.42 1.42M16.94 16.94l1.42 1.42M18.36 5.64l-1.42 1.42M7.06 16.94l-1.42 1.42"/><circle cx="12" cy="12" r="4"/></svg>
            <span>浅色</span>
          </button>
          <button class="theme-option" data-theme-option="dark" type="button" aria-pressed="false" title="深色模式">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.7 6.7 0 0 0 9.8 9.8Z"/></svg>
            <span>深色</span>
          </button>
        </div>
      </footer>
    </aside>

    <main class="editor" id="editor">
      <div class="mobile-bar">
        <button class="icon-button" id="openSidebar" type="button" aria-label="打开笔记列表">☰</button>
        <span>292笔记</span>
      </div>

      <section class="empty-state" id="emptyState" hidden>
        <div class="empty-icon">✎</div>
        <h1>开始记录你的想法</h1>
        <p>创建一篇新笔记，让灵感不再溜走。</p>
        <button class="new-note-button compact" id="emptyNewButton" type="button">＋ 新建笔记</button>
      </section>

      <section class="editor-panel" id="editorPanel">
        <header class="editor-toolbar">
          <div class="breadcrumb"><span>我的笔记</span><b>/</b><span id="breadcrumbTitle">未命名笔记</span></div>
          <div class="toolbar-actions">
            <span class="save-state" id="saveState"><i></i>已保存</span>
            <button class="icon-button" id="pinButton" type="button" aria-label="置顶笔记" title="置顶笔记">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 17-5 5v-8l-3-3 7-7 3 3 6-1-7 7 3 3Z"/></svg>
            </button>
            <button class="icon-button danger" id="deleteButton" type="button" aria-label="删除笔记" title="删除笔记">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/></svg>
            </button>
          </div>
        </header>

        <article class="writing-area">
          <input class="title-input" id="titleInput" type="text" placeholder="未命名笔记" aria-label="笔记标题" maxlength="100" />
          <div class="note-meta"><span id="dateLabel"></span><i></i><span id="wordCount">0 字</span></div>
          <textarea id="contentInput" placeholder="从这里开始写下你的想法..." aria-label="笔记内容" spellcheck="true"></textarea>
        </article>

        <footer class="editor-footer">
          <span id="footerStats">0 字 · 预计阅读 1 分钟</span>
          <span>自动保存已开启</span>
        </footer>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="deleteModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-icon">!</div>
      <h2 id="modalTitle">删除这篇笔记？</h2>
      <p>删除后将无法恢复，请确认是否继续。</p>
      <div class="modal-actions">
        <button class="secondary-button" id="cancelDelete" type="button">取消</button>
        <button class="delete-confirm" id="confirmDelete" type="button">确认删除</button>
      </div>
    </section>
  </div>

  <script src="note-model.js"></script>
  <script src="app.js"></script>
</body>
</html>
